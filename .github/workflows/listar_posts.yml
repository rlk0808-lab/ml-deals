name: Listar posts (Facebook/Instagram)

on:
  # Ferramenta manual de auditoria - por padrao so leitura, nao publica
  # nada. Apagar so acontece se "ids_para_apagar" for preenchido - a
  # decisao de quais IDs apagar e sempre humana (revisar a listagem
  # antes), nunca automatica.
  workflow_dispatch:
    inputs:
      ids_para_apagar:
        description: "IDs pra apagar (separados por virgula) - deixe vazio so pra listar"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  listar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Listar posts recentes
        if: ${{ github.event.inputs.ids_para_apagar == '' }}
        env:
          META_PAGE_ID:           ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID:        ${{ secrets.META_IG_USER_ID }}
        run: python -u listar_posts.py

      - name: Apagar posts especificos
        if: ${{ github.event.inputs.ids_para_apagar != '' }}
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: python -u apagar_posts.py "${{ github.event.inputs.ids_para_apagar }}"
