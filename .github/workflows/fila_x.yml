name: Fila diaria do X

on:
  # Sem "schedule:" nativo (pouco confiavel nesse repo) - disparado por
  # um cron externo (cron-job.org), 1x/dia de manha.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fila-x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Gerar fila do X
        env:
          TELEGRAM_TOKEN:        ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ROBSON:  ${{ secrets.TELEGRAM_CHAT_ROBSON }}
        run: python -u gerar_fila_x.py
