name: Postar apresentacao institucional

on:
  # Disparo manual - publica (ou republica) o post institucional "como
  # funciona" no Facebook e Instagram. Nao faz parte do ciclo
  # automatico de publicacao.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Postar apresentacao
        env:
          META_PAGE_ID:           ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID:        ${{ secrets.META_IG_USER_ID }}
        run: |
          git config user.name  "publicador-bot"
          git config user.email "publicador-bot@users.noreply.github.com"
          python -u postar_apresentacao.py
