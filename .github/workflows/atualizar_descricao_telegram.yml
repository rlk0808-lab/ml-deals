name: Atualizar descricao Telegram

on:
  # Disparo manual - troca o link antigo do site pelo dominio proprio
  # na descricao de cada canal/grupo. Uso pontual, nao faz parte do
  # ciclo automatico.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Trocar link na descricao
        env:
          TELEGRAM_TOKEN:        ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_LIVROS:  ${{ secrets.TELEGRAM_CHAT_LIVROS }}
          TELEGRAM_CHAT_BEBES:   ${{ secrets.TELEGRAM_CHAT_BEBES }}
          TELEGRAM_CHAT_CASA:    ${{ secrets.TELEGRAM_CHAT_CASA }}
          TELEGRAM_CHAT_MODA:    ${{ secrets.TELEGRAM_CHAT_MODA }}
          TELEGRAM_CHAT_BELEZA:  ${{ secrets.TELEGRAM_CHAT_BELEZA }}
        run: python -u atualizar_descricao_telegram.py
