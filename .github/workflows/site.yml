name: Gerar site (GitHub Pages)

on:
  workflow_run:
    workflows: ["Coletor de ofertas ML"]
    types: [completed]
  # dispara na hora quando o CODIGO do site muda (design, texto, links) -
  # sem isso, uma mudanca so aparecia no proximo workflow_run do coletor
  # (ate 3h de atraso), mesmo sem nenhum dado novo pra justificar a espera
  push:
    branches: [main]
    paths:
      - "site_builder.py"
      - "config/nichos.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-site:
    # coletor.yml roda os 4 nichos como matriz com fail-fast:false - se UM
    # nicho falhar, os outros 3 ainda sobem dados novos, mas a conclusao
    # GERAL do workflow vira "failure". Sem o segundo || abaixo, o site
    # parava de atualizar toda vez que um nicho falhasse, mesmo com dado
    # novo real dos outros 3 ja commitado. So pulamos mesmo em 'cancelled'
    # (nada rodou de verdade).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Gerar e publicar docs/
        env:
          SITE_URL: "https://rlk0808-lab.github.io/ml-deals"
        run: |
          git config user.name  "site-bot"
          git config user.email "site-bot@users.noreply.github.com"

          # mesmo padrao de retry do coletor/publicador - se o push
          # perder a corrida pra outro commit em main, descarta e gera
          # tudo de novo em cima do main mais recente, em vez de so
          # tentar re-commitar docs/ velho por cima de um main que mudou
          tentativas=3
          for i in $(seq 1 $tentativas); do
            echo "=== tentativa $i/$tentativas ==="
            git fetch origin main
            git reset --hard origin/main

            python site_builder.py

            git add docs/
            git commit -m "site: atualizar paginas $(date -u +%Y-%m-%d\ %H:%M)" || echo "nada novo"

            if git push origin main; then
              echo "=== site publicado com sucesso ==="
              exit 0
            fi

            echo "=== push rejeitado (alguem chegou primeiro), tentando de novo ==="
            sleep $((i * 5))
          done

          echo "::error::Nao foi possivel salvar apos $tentativas tentativas"
          exit 1
